services:
  postgres:
    image: postgres:16-alpine
    ports:
      - '5432:5432'
    environment:
      POSTGRES_USER: fulbo
      POSTGRES_PASSWORD: fulbo_dev
      POSTGRES_DB: fulbo_dev
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U fulbo -d fulbo_dev']
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build: .
    ports:
      - '4000:4000'
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://fulbo:fulbo_dev@postgres:5432/fulbo_dev
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./src:/app/src
      - ./prisma:/app/prisma

volumes:
  pgdata:
